name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp GitHub Pages build number
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          printf '{\n  "build": %s,\n  "label": "v%s"\n}\n' "$BUILD_NUMBER" "$BUILD_NUMBER" > site/build.json
          # Replace placeholders baked into the static site at deploy time.
          find site -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.svg' -o -name '*.json' \) \
            -exec sed -i "s/__BUILD_NUMBER__/${BUILD_NUMBER}/g" {} +
          echo "Stamped build v${BUILD_NUMBER}"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Create/enable the Pages site if missing (Actions as source).
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
